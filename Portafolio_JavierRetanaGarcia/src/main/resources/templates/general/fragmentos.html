<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">

        <meta charset="UTF-8">

        <title>[[#{aplicacion.titulo}]]</title>


        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
              rel="stylesheet"/>

        <!-- Bootstrap Icons -->
        <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"
              rel="stylesheet"/>

    </head>


    <body>

        <header th:fragment="header">

            <nav class="navbar navbar-expand-lg navbar-light bg-white">

                <div class="container">

                    <a class="navbar-brand"
                       th:href="@{/}">
                        [[#{aplicacion.titulo}]]
                    </a>

                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#navbarNav">

                        <span class="navbar-toggler-icon"></span>

                    </button>

                    <div class="collapse navbar-collapse"
                         id="navbarNav">

                        <ul class="navbar-nav ms-auto">

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/categoria/listado}">
                                    Categorías
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/ejemplo2}">
                                    Mis Autos
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/multimedia}">
                                    Multimedia
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/iframes}">
                                    iFrames
                                </a>
                            </li>

                            <li class="nav-item dropdown">

                                <a class="nav-link dropdown-toggle"
                                   href="#"
                                   role="button"
                                   data-bs-toggle="dropdown">

                                    [[#{plantilla.idioma}]]

                                </a>

                                <ul class="dropdown-menu">

                                    <li>
                                        <a class="dropdown-item"
                                           th:href="@{/(lang=es)}">
                                            Español
                                        </a>
                                    </li>

                                    <li>
                                        <a class="dropdown-item"
                                           th:href="@{/(lang=en)}">
                                            English
                                        </a>
                                    </li>

                                    <li>
                                        <a class="dropdown-item"
                                           th:href="@{/(lang=fr)}">
                                            Français
                                        </a>
                                    </li>

                                    <li>
                                        <a class="dropdown-item"
                                           th:href="@{/(lang=pt)}">
                                            Português
                                        </a>
                                    </li>

                                </ul>

                            </li>

                        </ul>

                    </div>

                </div>

            </nav>

        </header>


        <footer th:fragment="footer"
                class="bg-info text-white py-3">

            <div class="container text-center">

                <p class="mb-0">
                    [[#{plantilla.derechos}]]
                </p>

            </div>

            <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}">
                <script th:src="@{/js/rutinas.js}"></script>
            </script>

        </footer>
        <!-- Fragmentos #4 define una ventana tipo Toast para mostrar mensajes al usuario -->
        <section th:fragment="mostrarToast">
            <div aria-live="polite" aria-atomic="true" 
                 class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">                
                <div th:if="${error}" class="toast show"
                     role="alert"
                     aria-live="assertive"                     
                     aria-atomic="true"
                     data-bs-autohide="true">
                    <div class="toast-header text-white bg-danger">
                        <i class="fa-solid fa-bomb"></i> <strong class=me-auto> [[#{error}]]</strong>
                    </div>
                    <div class="toast-body">
                        <p>[[${error}]]</p>
                        <div class="mt-2 pt-2 border-top text-center">
                            <button type="button" class="btn btn-secondary btn-sm" 
                                    data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                        </div>
                    </div>
                </div>
                <div th:if="${todoOk}" class="toast show"
                     role="status"
                     aria-live="polite"
                     aria-atomic="true"
                     data-bs-autohide="true">
                    <div class="toast-header text-white bg-primary">
                        <i class="fa-solid fa-square-check"></i> <strong class=me-auto> [[#{atencion}]]</strong>
                    </div>
                    <div class="toast-body">
                        <p>[[${todoOk}]]</p>
                        <div class="mt-2 pt-2 border-top text-center">
                            <button type="button" class="btn btn-secondary btn-sm" 
                                    data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>

</html>
