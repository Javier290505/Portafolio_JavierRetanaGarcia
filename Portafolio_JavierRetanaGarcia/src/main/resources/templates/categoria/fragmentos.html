<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">

        <meta charset="UTF-8">

        <title>[[#{aplicacion.titulo}]]</title>

        <!-- Bootstrap -->
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
              rel="stylesheet"/>

        <!-- Bootstrap Icons -->
        <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"
              rel="stylesheet"/>

    </head>


    <body>
        <!-- fragmento 1 para Agregar categoria en ventana modal -->
        <section th:fragment="agregar">
            <!-- Button trigger modal -->
            <div class='row py-4 mb-2 bg-light'>
                <div class='col-md-1'></div>
                <div class='col-md-3'>
                    <button type="button" class="btn btn-primary"  sec:authorize="hasRole('ROLE_ADMIN')"
                            data-bs-toggle="modal" data-bs-target="#agregarCategoriaModal">
                        <i class="fa-solid fa-plus"></i> [[#{categoria.agregar}]]</button>
                </div>
            </div>
            <!-- Modal -->
            <div class="modal fade" id="agregarCategoriaModal"  tabindex="-1" 
                 aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header bg-info text-white">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">
                                <i class="fa-solid fa-layer-group"></i> [[#{categoria.agregar}]]</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action='@{/categoria/guardar}' th:object='${categoria}'
                              class='was-validated' enctype="multipart/form-data" method="post">
                            <div class="modal-body">
                                <div class='mb-3'>
                                    <label>[[#{categoria.descripcion}]]</label>
                                    <input type="text" name='descripcion' class='form-control' required="true"/></div>
                                <div class='mb-3'>
                                    <label>[[#{categoria.activo}]]</label>
                                    <input type="checkbox" name='activo' class='form-check-input'/></div>
                                <div class='mb-3'>
                                    <label>[[#{categoria.imagen}]]</label>
                                    <input type="file" name='imagenFile' onchange='mostrarImagen(this);'
                                           class='form-control'/>
                                    <img id='blah' src='#' alt='imagen de categoría' height="200"/></div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]</button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- ============================= -->
        <!-- HEADER / MENÚ DE NAVEGACIÓN -->
        <!-- ============================= -->

        <header th:fragment="header">

            <nav class="navbar navbar-expand-lg navbar-light bg-white">

                <div class="container">

                    <a class="navbar-brand"
                       th:href="@{/}">
                        [[#{aplicacion.titulo}]]
                    </a>

                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#navbarNav">

                        <span class="navbar-toggler-icon"></span>

                    </button>

                    <div class="collapse navbar-collapse"
                         id="navbarNav">

                        <ul class="navbar-nav ms-auto">

                            <!-- Categorías -->
                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/categoria/listado}">
                                    Categorías
                                </a>

                            </li>


                            <!-- Mis Autos -->
                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/ejemplo2}">
                                    Mis Autos
                                </a>

                            </li>


                            <!-- Multimedia -->
                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/multimedia}">
                                    Multimedia
                                </a>

                            </li>


                            <!-- iFrames -->
                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/iframes}">
                                    iFrames
                                </a>

                            </li>


                            <!-- Idiomas -->
                            <li class="nav-item dropdown">

                                <a class="nav-link dropdown-toggle"
                                   href="#"
                                   role="button"
                                   data-bs-toggle="dropdown">

                                    [[#{plantilla.idioma}]]

                                </a>

                                <ul class="dropdown-menu">

                                    <li>

                                        <a class="dropdown-item"
                                           th:href="@{/(lang=es)}">
                                            Español
                                        </a>

                                    </li>

                                    <li>

                                        <a class="dropdown-item"
                                           th:href="@{/(lang=en)}">
                                            English
                                        </a>

                                    </li>

                                    <li>

                                        <a class="dropdown-item"
                                           th:href="@{/(lang=fr)}">
                                            Français
                                        </a>

                                    </li>

                                    <li>

                                        <a class="dropdown-item"
                                           th:href="@{/(lang=pt)}">
                                            Português
                                        </a>

                                    </li>

                                </ul>

                            </li>

                        </ul>

                    </div>

                </div>

            </nav>

        </header>


        <!-- ============================= -->
        <!-- FOOTER -->
        <!-- ============================= -->

        <footer th:fragment="footer"
                class="bg-info text-white py-3">

            <div class="container text-center">

                <p class="mb-0">
                    [[#{plantilla.derechos}]]
                </p>

            </div>


            <!-- JavaScript de Bootstrap -->
            <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

            <!-- JavaScript del proyecto -->
            <script th:src="@{/js/rutinas.js}"></script>

        </footer>


        <!-- ============================= -->
        <!-- TOAST DE MENSAJES -->
        <!-- ============================= -->

        <section th:fragment="mostrarToast">

            <div aria-live="polite"
                 aria-atomic="true"
                 class="position-fixed top-50 start-50 translate-middle"
                 style="z-index: 1080;">


                <!-- Mensaje de ERROR -->

                <div th:if="${error}"
                     class="toast show"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true"
                     data-bs-autohide="true">

                    <div class="toast-header text-white bg-danger">

                        <i class="bi bi-exclamation-triangle-fill me-2"></i>

                        <strong class="me-auto">
                            [[#{error}]]
                        </strong>

                    </div>


                    <div class="toast-body">

                        <p>
                            [[${error}]]
                        </p>

                        <div class="mt-2 pt-2 border-top text-center">

                            <button type="button"
                                    class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="toast">

                                [[#{accion.cerrar}]]

                            </button>

                        </div>

                    </div>

                </div>


                <!-- Mensaje CORRECTO -->

                <div th:if="${todoOk}"
                     class="toast show"
                     role="status"
                     aria-live="polite"
                     aria-atomic="true"
                     data-bs-autohide="true">

                    <div class="toast-header text-white bg-success">

                        <i class="bi bi-check-square-fill me-2"></i>

                        <strong class="me-auto">
                            [[#{atencion}]]
                        </strong>

                    </div>


                    <div class="toast-body">

                        <p>
                            [[${todoOk}]]
                        </p>

                        <div class="mt-2 pt-2 border-top text-center">

                            <button type="button"
                                    class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="toast">

                                [[#{accion.cerrar}]]

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </body>

</html>
