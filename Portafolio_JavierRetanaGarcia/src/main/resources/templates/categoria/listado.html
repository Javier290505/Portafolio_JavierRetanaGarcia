<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>
        
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

        <main class="container my-4">

            <div class="mb-4">
                <a th:href="@{/categoria/nuevo}"
                   class="btn btn-primary">
                    + Agregar Categoría
                </a>
            </div>

            <h3>Listado de Categorías</h3>

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Descripción</th>
                            <th>Imagen</th>
                            <th>Activo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="categoria, contador : ${categorias}">

                            <td th:text="${contador.count}"></td>

                            <td th:text="${categoria.descripcion}"></td>

                            <td>
                                <img th:if="${categoria.rutaImagen != null}"
                                     th:src="${categoria.rutaImagen}"
                                     alt="Imagen"
                                     width="100">
                            </td>

                            <td th:text="${categoria.activo ? 'Sí' : 'No'}"></td>

                            <td>

                                <a th:href="@{/categoria/modificar/{id}(id=${categoria.idCategoria})}"
                                   class="btn btn-success btn-sm">
                                    Actualizar
                                </a>

                                <button type="button"
                                        class="btn btn-danger btn-sm"
                                        data-bs-toggle="modal"
                                        data-bs-target="#confirmModal"
                                        th:attr="data-id=${categoria.idCategoria},
                                        data-descripcion=${categoria.descripcion}">
                                    Eliminar
                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>
                
                <div class="modal fade"
                     id="confirmModal"
                     tabindex="-1"
                     aria-labelledby="confirmModalLabel"
                     aria-hidden="true">

                    <div class="modal-dialog">

                        <div class="modal-content">

                            <div class="modal-header bg-danger text-white">

                                <h5 class="modal-title"
                                    id="confirmModalLabel">
                                    Confirmar eliminación
                                </h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal"
                                        aria-label="Cerrar">
                                </button>

                            </div>

                            <div class="modal-body">

                                <p>
                                    ¿Realmente desea eliminar la categoría
                                    <strong id="modalDescripcion"></strong>?
                                </p>

                                <p>
                                    Esta acción no se puede reversar.
                                </p>

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Cerrar
                                </button>

                                <button type="button"
                                        class="btn btn-danger"
                                        onclick="confirmarEliminacion()">
                                    Eliminar
                                </button>

                            </div>

                        </div>
                    </div>
                </div>

            </div>

            <p>
                Total de Categorías:
                <strong th:text="${totalCategorias}"></strong>
            </p>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

        <script th:src="@{/js/rutinas.js}"></script>
    </body>

</html>
