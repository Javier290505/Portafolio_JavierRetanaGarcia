<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container my-4">

            <div class="card">

                <div class="card-header">
                    <h4 th:text="${categoria.idCategoria == null 
                        ? 'Agregar Categoría' 
                        : 'Actualizar Categoría'}">
                        Categoría
                    </h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/categoria/guardar}"
                          th:object="${categoria}"
                          method="post">

                        <input type="hidden"
                               th:field="*{idCategoria}"/>

                        <div class="mb-3">
                            <label class="form-label">
                                Descripción
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{descripcion}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Ruta de la imagen
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{rutaImagen}"
                                   placeholder="https://... o /img/imagen.jpg">
                        </div>

                        <div class="form-check mb-3">

                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{activo}">

                            <label class="form-check-label">
                                Activo
                            </label>

                        </div>

                        <a th:href="@{/categoria/listado}"
                           class="btn btn-secondary">
                            Regresar
                        </a>

                        <button type="submit"
                                class="btn btn-success">
                            Guardar
                        </button>

                    </form>

                </div>
            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
