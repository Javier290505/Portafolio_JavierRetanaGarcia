<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container my-4">

            <!-- Botón para agregar producto -->
            <div class="mb-4">

                <a th:href="@{/producto/nuevo}"
                   class="btn btn-primary">
                    + Agregar Producto
                </a>

            </div>


            <h3>Listado de Productos</h3>


            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Existencias</th>
                            <th>Imagen</th>
                            <th>Categoría</th>
                            <th>Activo</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>


                    <tbody>

                        <tr th:each="producto, contador : ${productos}">

                            <!-- Número -->
                            <td th:text="${contador.count}"></td>


                            <!-- Descripción -->
                            <td th:text="${producto.descripcion}"></td>


                            <!-- Precio -->
                            <td th:text="${producto.precio}"></td>


                            <!-- Existencias -->
                            <td th:text="${producto.existencias}"></td>


                            <!-- Imagen -->
                            <td>

                                <img th:if="${producto.rutaImagen != null}"
                                     th:src="${producto.rutaImagen}"
                                     alt="Imagen"
                                     width="80">

                            </td>


                            <!-- Categoría -->
                            <td th:text="${producto.categoria.descripcion}"></td>


                            <!-- Activo -->
                            <td th:text="${producto.activo ? 'Sí' : 'No'}"></td>


                            <!-- Acciones -->
                            <td>

                                <a th:href="@{/producto/modificar/{id}(id=${producto.idProducto})}"
                                   class="btn btn-success btn-sm">
                                    Actualizar
                                </a>


                                <button type="button"
                                        class="btn btn-danger btn-sm"
                                        data-bs-toggle="modal"
                                        data-bs-target="#confirmModalProducto"
                                        th:attr="data-id=${producto.idProducto},
                                                 data-descripcion=${producto.descripcion}">
                                    Eliminar
                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <p>
                Total de Productos:
                <strong th:text="${totalProductos}"></strong>
            </p>

            <div class="modal fade"
                 id="confirmModalProducto"
                 tabindex="-1"
                 aria-labelledby="confirmModalProductoLabel"
                 aria-hidden="true">

                <div class="modal-dialog">

                    <div class="modal-content">

                        <div class="modal-header bg-danger text-white">

                            <h5 class="modal-title"
                                id="confirmModalProductoLabel">
                                Confirmar eliminación
                            </h5>

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal"
                                    aria-label="Cerrar">
                            </button>

                        </div>


                        <div class="modal-body">

                            <p>
                                ¿Realmente desea eliminar el producto
                                <strong id="modalDescripcionProducto"></strong>?
                            </p>

                            <p>
                                Esta acción no se puede reversar.
                            </p>

                        </div>


                        <div class="modal-footer">

                            <button type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                Cerrar
                            </button>

                            <button type="button"
                                    class="btn btn-danger"
                                    onclick="confirmarEliminacionProducto()">
                                Eliminar
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </main>


        <!-- Toast -->
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>


        <!-- Footer -->
        <footer th:replace="~{general/fragmentos :: footer}"></footer>


        <script th:src="@{/js/rutinas.js}"></script>

    </body>

</html>
