<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

    <header th:replace="~{general/fragmentos :: header}"></header>

    <main class="container my-4">

        <h3 th:text="${producto.idProducto == null}
                    ? 'Agregar Producto'
                    : 'Modificar Producto'">
        </h3>

        <form th:action="@{/producto/guardar}"
              th:object="${producto}"
              method="post">

            <!-- ID -->
            <input type="hidden"
                   th:field="*{idProducto}">


            <!-- CATEGORÍA -->
            <div class="mb-3">

                <label class="form-label">
                    Categoría
                </label>

                <select class="form-select"
                        th:field="*{idCategoria}"
                        required>

                    <option value="">
                        Seleccione una categoría
                    </option>

                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.idCategoria}"
                            th:text="${categoria.descripcion}">
                    </option>

                </select>

            </div>


            <!-- DESCRIPCIÓN -->
            <div class="mb-3">

                <label class="form-label">
                    Descripción
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{descripcion}"
                       required>

            </div>


            <!-- DETALLE -->
            <div class="mb-3">

                <label class="form-label">
                    Detalle
                </label>

                <textarea class="form-control"
                          th:field="*{detalle}"
                          rows="3">
                </textarea>

            </div>


            <!-- PRECIO -->
            <div class="mb-3">

                <label class="form-label">
                    Precio
                </label>

                <input type="number"
                       class="form-control"
                       th:field="*{precio}"
                       min="0"
                       step="0.01"
                       required>

            </div>


            <!-- EXISTENCIAS -->
            <div class="mb-3">

                <label class="form-label">
                    Existencias
                </label>

                <input type="number"
                       class="form-control"
                       th:field="*{existencias}"
                       min="0"
                       required>

            </div>


            <!-- ACTIVO -->
            <div class="form-check mb-3">

                <input type="checkbox"
                       class="form-check-input"
                       th:field="*{activo}">

                <label class="form-check-label">
                    Activo
                </label>

            </div>


            <!-- RUTA DE IMAGEN -->
            <div class="mb-3">

                <label class="form-label">
                    Ruta de la imagen
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{rutaImagen}"
                       placeholder="https://... o /img/imagen.jpg">

            </div>


            <!-- IMAGEN ACTUAL -->
            <div class="mb-3"
                 th:if="${producto.rutaImagen != null
                         and !producto.rutaImagen.isEmpty()}">

                <p>Imagen actual:</p>

                <img th:src="${producto.rutaImagen}"
                     alt="Imagen del producto"
                     style="max-height: 200px;">

            </div>


            <!-- BOTONES -->
            <div class="mt-4">

                <button type="submit"
                        class="btn btn-success">
                    Guardar
                </button>

                <a th:href="@{/producto/listado}"
                   class="btn btn-secondary">
                    Regresar
                </a>

            </div>

        </form>

    </main>


    <footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>

</html>
